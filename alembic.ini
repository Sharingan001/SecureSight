# Alembic configuration for SecureSight.

[alembic]
# Path to migration scripts (relative to this file)
script_location = backend/alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename. Defaults to UTC.
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# having their parent .py files present
# sourceless = false

# Version path separator — OS-specific by default
# version_path_separator = os

# sqlalchemy.url is loaded from env vars in env.py — NOT here.
# This prevents secrets from being committed to version control.
# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# hooks to run after generating new revision files
# format using "black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
